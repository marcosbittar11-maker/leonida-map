<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10121d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Mapa interativo de Leonida com guias, rotas e progresso para GTA VI.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="icon" href="./icons/icon.svg">
<title>Leonida Map · GTA VI</title></head>
<body>
<header class="topbar" id="topbar" hidden>
<button class="brand" data-action="home" aria-label="Leonida Map, visão geral"><i class="brand-mark" data-icon="navigation"></i><span>Leonida<span class="brand-accent"> Map</span><small>GTA VI</small></span></button>
<nav aria-label="Navegação principal"><button class="nav-btn active" data-panel="map"><i data-icon="map"></i>Mapa</button><button class="nav-btn" data-panel="rank"><i data-icon="trophy"></i>Rankings</button><button class="nav-btn" data-panel="route"><i data-icon="route"></i>Rotas</button><button class="nav-btn" data-panel="progress"><i data-icon="chart-no-axes-column-increasing"></i>Progresso</button></nav>
<button class="chapter" data-action="settings"><i data-icon="shield-check"></i><span id="chapter-label">Capítulo</span><i data-icon="chevron-down"></i></button>
</header>
<main class="chapter-gate" id="chapter-gate" aria-labelledby="chapter-question" hidden>
<form id="initial-chapter">
<div class="brand-mark" data-icon="navigation"></div>
<p class="gate-brand">Leonida Map</p>
<h1 id="chapter-question">Em qual capítulo você está?</h1>
<p>Usamos sua escolha para proteger você de spoilers.</p>
<label class="form-row">Capítulo atual
<select name="chapter" required><option value="" selected disabled>Selecione um capítulo</option></select>
</label>
<button type="submit" class="ui-button primary full">Abrir mapa</button>
</form>
</main>
<p role="alert" class="startup-error" id="startup-error" hidden>Não foi possível carregar o mapa. Recarregue a página com internet.</p>
<main class="workspace" id="workspace" hidden>
<aside class="sidebar" id="sidebar" aria-label="Painel de exploração">
<div class="mobile-grip" aria-hidden="true"></div>
<div class="panel-head"><div><h1 id="panel-title">Explorar Leonida</h1><p id="panel-caption">Pontos de interesse e guias de GTA VI</p></div><button class="icon-button" data-action="sidebar" aria-label="Recolher painel"><i data-icon="panel-left-close"></i></button></div>
<section id="search-tools">
<label class="searchbox"><i data-icon="search"></i><input id="query" type="search" aria-label="Buscar em Leonida" placeholder="Buscar local, região ou atividade…" autocomplete="off"><kbd>/</kbd></label>
<div class="chips"><button class="chip active" data-status="all">Todos</button><button class="chip" data-status="pending">Pendentes</button><button class="chip" data-status="done">Concluídos</button><button class="chip square" data-status="favorite" aria-label="Favoritos"><i data-icon="star"></i></button></div>
<div class="chips quick"><button class="chip" data-filter="guides">Com guia</button><button class="chip" data-filter="peace">Sem confronto</button><button class="chip" data-filter="repeat">Repetíveis</button></div>
</section>
<div class="panel-scroll" id="panel-content"></div><footer class="sidebar-footer" id="panel-footer"></footer>
</aside>
<section class="map-zone" aria-label="Mapa de Leonida">
<div id="map" aria-label="Mapa interativo de Leonida"></div>
<div class="map-hud"><button class="map-button" data-action="sidebar" aria-label="Abrir filtros"><i data-icon="sliders-horizontal"></i><span>Filtros</span></button><span class="map-count"><span class="count-light"></span><b id="map-count">Carregando…</b></span></div>
<div class="map-controls" aria-label="Controles do mapa"><button class="icon-button" data-action="zoom-in" aria-label="Aproximar"><i data-icon="plus"></i></button><button class="icon-button" data-action="zoom-out" aria-label="Afastar"><i data-icon="minus"></i></button><button class="icon-button" data-action="reset-map" aria-label="Centralizar mapa"><i data-icon="locate-fixed"></i></button><button class="icon-button custom-add" data-action="place" aria-label="Adicionar ponto personalizado"><i data-icon="map-pin-plus"></i></button></div>
<p class="placement" id="placement" hidden>Toque no mapa para criar um ponto <button data-action="cancel-place">Cancelar</button></p>
<article class="detail" id="detail" aria-label="Detalhes do ponto" hidden></article><p class="toast" id="toast" role="status" hidden></p>
</section>
</main>
<dialog id="dialog"></dialog><input id="backup-input" type="file" accept=".json,application/json" hidden>
<script type="module" src="/src/main.js"></script></body></html>
